<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windchill-Rechner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Windchill-Rechner</h1>
  <p class="hint">Lufttemperatur und Windgeschwindigkeit eintragen, die gefühlte Kälte wird live nach der NWS-Windchill-Formel berechnet.</p>

  <div class="field">
    <label for="tempInput">Lufttemperatur (°C)</label>
    <input type="number" id="tempInput" value="-5" step="0.1">
  </div>

  <div class="field">
    <label for="windInput">Windgeschwindigkeit (km/h)</label>
    <input type="number" id="windInput" value="20" min="0" step="1">
  </div>

  <p class="error" id="error" hidden></p>

  <div class="output" id="output">
    <p class="result-label">Gefühlte Temperatur</p>
    <p class="result-value" id="resultValue">–</p>
    <p class="category" id="category"></p>
  </div>

  <p class="note" id="note" hidden></p>
</div>
<script src="script.js"></script>
</body>
</html>

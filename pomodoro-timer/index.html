<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Pomodoro Timer</h1>
  <p class="hint">Rein clientseitig, nichts wird irgendwohin gesendet.</p>

  <div class="mode" id="mode">Fokus</div>

  <div class="display" id="display">25:00</div>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="pauseBtn" disabled>Pause</button>
    <button id="resetBtn">Zurücksetzen</button>
  </div>

  <div class="settings">
    <label>
      Fokus (Min.)
      <input type="number" id="focusInput" min="1" max="90" value="25">
    </label>
    <label>
      Pause (Min.)
      <input type="number" id="breakInput" min="1" max="60" value="5">
    </label>
  </div>

  <div class="sessions">
    <span class="value" id="sessionCount">0</span>
    <span class="stat-label">abgeschlossene Fokus-Sessions</span>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

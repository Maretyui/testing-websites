<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binäruhr</title>
<link rel="stylesheet" href="style.css">
<meta http-equiv="Content-Security-Policy" content="script-src 'self'">
</head>
<body>
<div class="container">
    <h1>Binäruhr</h1>
    <p class="subtitle">Jede Spalte zeigt eine Ziffer der Uhrzeit in binärer Kodierung (BCD). Von oben nach unten: 8-4-2-1.</p>

    <div class="clock" id="clock" role="img" aria-label="Binäruhr">
        <div class="group" data-group="hours">
            <div class="digit" data-digit="h0"></div>
            <div class="digit" data-digit="h1"></div>
        </div>
        <div class="colon">:</div>
        <div class="group" data-group="minutes">
            <div class="digit" data-digit="m0"></div>
            <div class="digit" data-digit="m1"></div>
        </div>
        <div class="colon">:</div>
        <div class="group" data-group="seconds">
            <div class="digit" data-digit="s0"></div>
            <div class="digit" data-digit="s1"></div>
        </div>
    </div>

    <p class="readout" id="readout">00:00:00</p>
</div>
<script src="script.js"></script>
</body>
</html>

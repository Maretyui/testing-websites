<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palindrome Checker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Palindrome Checker</h1>
  <p class="hint">Tippe einen Satz oder ein Wort — Groß-/Kleinschreibung, Leerzeichen und Satzzeichen werden ignoriert.</p>

  <label class="field">
    Text
    <input type="text" id="input" placeholder="z. B. Ein Neger mit Gazelle zagt im Regen nie">
  </label>

  <p id="result" class="result">Ergebnis erscheint hier.</p>

  <div class="longest">
    <span class="label">Längstes palindromisches Teilwort:</span>
    <span id="longest" class="value">—</span>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

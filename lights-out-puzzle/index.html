<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lights Out</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Lights Out</h1>
  <p class="hint">Tippe ein Feld an: es und seine direkten Nachbarn (oben/unten/links/rechts) schalten um. Schalte alle Lichter aus.</p>

  <div class="stats">
    <div>
      <span class="label">Züge</span>
      <span id="moves" class="value">0</span>
    </div>
    <div>
      <span class="label">Bestwert</span>
      <span id="best" class="value">–</span>
    </div>
  </div>

  <div id="grid" class="grid"></div>

  <p id="status" class="status" aria-live="polite"></p>
  <button id="newBtn" type="button">Neues Rätsel</button>
</div>
<script src="script.js"></script>
</body>
</html>

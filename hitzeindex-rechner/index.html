<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitzeindex-Rechner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Hitzeindex-Rechner</h1>
  <p class="hint">Lufttemperatur und relative Luftfeuchtigkeit eintragen, die gefühlte Temperatur wird live nach der NWS-Formel berechnet.</p>

  <div class="field">
    <label for="tempInput">Lufttemperatur (°C)</label>
    <input type="number" id="tempInput" value="32" step="0.1">
  </div>

  <div class="field">
    <label for="humidityInput">Relative Luftfeuchtigkeit (%)</label>
    <input type="number" id="humidityInput" value="60" min="0" max="100" step="1">
  </div>

  <p class="error" id="error" hidden></p>

  <div class="output" id="output">
    <p class="result-label">Gefühlte Temperatur</p>
    <p class="result-value" id="resultValue">–</p>
    <p class="category" id="category"></p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

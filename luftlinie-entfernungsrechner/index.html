<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luftlinie-Entfernungsrechner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Luftlinie-Entfernungsrechner</h1>
  <p class="hint">Zwei Koordinatenpaare eintragen, die Luftlinie wird live über die Haversine-Formel auf der Erdkugel berechnet.</p>

  <div class="point">
    <p class="point-label">Punkt A</p>
    <div class="field-row">
      <div class="field">
        <label for="lat1Input">Breitengrad</label>
        <input type="number" id="lat1Input" value="53.5511" step="0.0001" min="-90" max="90">
      </div>
      <div class="field">
        <label for="lon1Input">Längengrad</label>
        <input type="number" id="lon1Input" value="9.9937" step="0.0001" min="-180" max="180">
      </div>
    </div>
  </div>

  <div class="point">
    <p class="point-label">Punkt B</p>
    <div class="field-row">
      <div class="field">
        <label for="lat2Input">Breitengrad</label>
        <input type="number" id="lat2Input" value="52.5200" step="0.0001" min="-90" max="90">
      </div>
      <div class="field">
        <label for="lon2Input">Längengrad</label>
        <input type="number" id="lon2Input" value="13.4050" step="0.0001" min="-180" max="180">
      </div>
    </div>
  </div>

  <p class="error" id="error" hidden></p>

  <div class="output" id="output">
    <p class="result-label">Entfernung (Luftlinie)</p>
    <p class="result-value" id="resultValue">–</p>
    <p class="result-sub" id="resultSub"></p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

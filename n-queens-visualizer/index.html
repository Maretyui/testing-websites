<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N-Damen-Problem Visualisierer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>N-Damen-Problem</h1>
  <p class="hint">Backtracking live Schritt für Schritt: Eine Dame pro Zeile wird gesetzt; sobald sie eine andere Dame angreift, geht der Algorithmus eine Zeile zurück und probiert die nächste Spalte.</p>

  <div class="row">
    <div class="field size-field">
      <label for="sizeInput">Brettgröße (N)</label>
      <input type="number" id="sizeInput" value="6" min="4" max="9">
    </div>
    <div class="field speed-field">
      <label for="speedInput">Tempo</label>
      <input type="range" id="speedInput" min="1" max="200" value="60">
    </div>
    <div class="buttons">
      <button id="startBtn" type="button">Starten</button>
      <button id="stopBtn" type="button" disabled>Stop</button>
    </div>
  </div>

  <p class="status" id="status" role="status" aria-live="polite">Bereit.</p>

  <div class="board-wrap">
    <div id="board" class="board" role="img" aria-label="N-Damen Schachbrett"></div>
  </div>

  <p class="hint small" id="solutionCount"></p>
</div>
<script src="script.js"></script>
</body>
</html>

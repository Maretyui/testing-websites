<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galgenmännchen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Galgenmännchen</h1>
  <p class="hint">Errate das Wort, bevor die Zeichnung fertig ist. Klicke einen Buchstaben oder tippe ihn direkt auf der Tastatur.</p>

  <div class="game-area">
    <svg id="gallows" viewBox="0 0 200 220" aria-hidden="true">
      <line x1="10" y1="210" x2="150" y2="210" />
      <line x1="40" y1="210" x2="40" y2="10" />
      <line x1="40" y1="10" x2="120" y2="10" />
      <line x1="120" y1="10" x2="120" y2="40" />
      <circle id="part-head" cx="120" cy="60" r="20" />
      <line id="part-body" x1="120" y1="80" x2="120" y2="140" />
      <line id="part-arm-left" x1="120" y1="95" x2="100" y2="120" />
      <line id="part-arm-right" x1="120" y1="95" x2="140" y2="120" />
      <line id="part-leg-left" x1="120" y1="140" x2="100" y2="170" />
      <line id="part-leg-right" x1="120" y1="140" x2="140" y2="170" />
    </svg>

    <div class="info">
      <p class="word-display" id="wordDisplay" aria-live="polite"></p>
      <p class="category" id="categoryDisplay"></p>
      <p class="tries" id="triesDisplay"></p>
      <p class="message" id="messageDisplay" role="alert"></p>
    </div>
  </div>

  <div class="keyboard" id="keyboard" aria-label="Buchstaben"></div>

  <div class="actions">
    <button type="button" id="newWordBtn">Neues Wort</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

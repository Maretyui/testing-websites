<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resistor Color Code Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Resistor Color Code Calculator</h1>
  <p class="hint">Wähle die Farbringe, um den Widerstandswert live abzulesen — oder gib einen Wert ein, um die passenden Ringe zu finden.</p>

  <div class="resistor">
    <div class="lead"></div>
    <div class="band" id="band1"></div>
    <div class="band" id="band2"></div>
    <div class="band" id="band3"></div>
    <div class="band" id="band4"></div>
    <div class="lead"></div>
  </div>

  <div class="selects">
    <label>
      Ring 1
      <select id="digit1"></select>
    </label>
    <label>
      Ring 2
      <select id="digit2"></select>
    </label>
    <label>
      Multiplikator
      <select id="multiplier"></select>
    </label>
    <label>
      Toleranz
      <select id="tolerance"></select>
    </label>
  </div>

  <p class="result" id="resultText"></p>

  <div class="reverse">
    <label for="valueInput">Oder: Wert eingeben (Ω)</label>
    <input type="number" id="valueInput" placeholder="z. B. 4700">
    <button id="applyBtn" type="button">Ringe setzen</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

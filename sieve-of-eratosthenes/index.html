<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sieb des Eratosthenes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Sieb des Eratosthenes</h1>
  <p class="hint">Streicht Schritt für Schritt alle Vielfachen jeder Primzahl durch, bis nur noch Primzahlen übrig sind.</p>

  <label class="field">
    Obergrenze
    <input type="number" id="limit" min="10" max="2000" step="1" value="200">
  </label>

  <div class="controls">
    <button id="startBtn">Neu starten</button>
    <button id="stepBtn">Einzelschritt</button>
    <button id="autoBtn">Automatisch</button>
  </div>

  <label class="field speed">
    Geschwindigkeit
    <input type="range" id="speed" min="30" max="800" step="10" value="250">
  </label>

  <p class="status" id="status">Bereit — auf „Neu starten“ tippen.</p>

  <div class="grid" id="grid"></div>

  <div class="summary" id="summary"></div>
</div>
<script src="script.js"></script>
</body>
</html>

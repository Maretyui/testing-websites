<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einheitskreis-Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Einheitskreis-Explorer</h1>
  <p class="hint">Ziehe den Punkt auf dem Kreis oder nutze den Schieberegler, um Sinus, Kosinus und Tangens live zu sehen.</p>

  <canvas id="circle" width="320" height="320"></canvas>

  <input
    type="range"
    id="angleSlider"
    min="0"
    max="359"
    step="1"
    value="45"
    aria-label="Winkel in Grad"
  >

  <div class="readout" role="status" aria-live="polite">
    <div class="readout-row">
      <span class="readout-label">Winkel</span>
      <span class="readout-value" id="angleDeg">45°</span>
    </div>
    <div class="readout-row">
      <span class="readout-label">Radiant</span>
      <span class="readout-value" id="angleRad">0.785</span>
    </div>
    <div class="readout-row">
      <span class="readout-label">sin θ</span>
      <span class="readout-value sin" id="sinValue">0.707</span>
    </div>
    <div class="readout-row">
      <span class="readout-label">cos θ</span>
      <span class="readout-value cos" id="cosValue">0.707</span>
    </div>
    <div class="readout-row">
      <span class="readout-label">tan θ</span>
      <span class="readout-value tan" id="tanValue">1.000</span>
    </div>
  </div>

  <div class="presets" role="group" aria-label="Häufige Winkel">
    <button type="button" class="preset-btn" data-angle="0">0°</button>
    <button type="button" class="preset-btn" data-angle="30">30°</button>
    <button type="button" class="preset-btn" data-angle="45">45°</button>
    <button type="button" class="preset-btn" data-angle="90">90°</button>
    <button type="button" class="preset-btn" data-angle="180">180°</button>
    <button type="button" class="preset-btn" data-angle="270">270°</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

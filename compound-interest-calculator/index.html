<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zinseszins-Rechner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Zinseszins-Rechner</h1>
  <p class="hint">Startkapital, Zinssatz und Laufzeit eingeben — Endkapital und Zinsertrag erscheinen live, optional mit monatlicher Sparrate.</p>

  <div class="field">
    <label for="principal">Startkapital (€)</label>
    <input type="number" id="principal" value="1000" min="0" step="1" inputmode="decimal">
  </div>

  <div class="field">
    <label for="rate">Zinssatz pro Jahr (%)</label>
    <input type="number" id="rate" value="5" min="0" step="0.1" inputmode="decimal">
  </div>

  <div class="field">
    <label for="years">Laufzeit (Jahre)</label>
    <input type="number" id="years" value="10" min="1" step="1" inputmode="numeric">
  </div>

  <div class="field">
    <label for="contribution">Monatliche Sparrate (€, optional)</label>
    <input type="number" id="contribution" value="0" min="0" step="1" inputmode="decimal">
  </div>

  <div class="field">
    <label for="frequency">Zinsperioden pro Jahr</label>
    <select id="frequency">
      <option value="1">jährlich</option>
      <option value="4">vierteljährlich</option>
      <option value="12" selected>monatlich</option>
      <option value="365">täglich</option>
    </select>
  </div>

  <div class="result" id="result">
    <div class="result-row">
      <span>Endkapital</span>
      <strong id="finalAmount">–</strong>
    </div>
    <div class="result-row">
      <span>Eingezahlt insgesamt</span>
      <strong id="totalDeposited">–</strong>
    </div>
    <div class="result-row highlight">
      <span>Zinsertrag</span>
      <strong id="totalInterest">–</strong>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

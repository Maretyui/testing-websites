<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roller</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Dice Roller</h1>
  <p class="hint">Wähle Anzahl und Seitenzahl der Würfel, würfle, und behalte die letzten Ergebnisse im Verlauf.</p>

  <div class="settings">
    <label>
      Anzahl Würfel
      <input type="number" id="countInput" min="1" max="12" value="2">
    </label>
    <label>
      Seiten
      <select id="sidesInput">
        <option value="4">D4</option>
        <option value="6" selected>D6</option>
        <option value="8">D8</option>
        <option value="10">D10</option>
        <option value="12">D12</option>
        <option value="20">D20</option>
      </select>
    </label>
  </div>

  <button id="rollBtn">Würfeln</button>

  <div id="dice" class="dice"></div>
  <p id="total" class="total"></p>

  <h2 class="history-title">Verlauf</h2>
  <ul id="history" class="history"></ul>
  <p id="emptyHistory" class="empty">Noch nicht gewürfelt.</p>
</div>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII-Textbanner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>ASCII-Textbanner</h1>
  <p class="hint">Rendert Text als großes Pixel-Banner, indem ein unsichtbares Canvas abgetastet wird — keine vorgefertigte Pixel-Schrift nötig, funktioniert mit jedem Zeichen, das der Browser darstellen kann.</p>

  <label for="textInput">Text</label>
  <input type="text" id="textInput" maxlength="18" placeholder="Text eingeben..." autocomplete="off" value="Hallo!">

  <div class="output-wrap">
    <pre id="bannerOutput" aria-live="polite"></pre>
  </div>

  <button id="copyBtn" class="copy-btn" type="button">Banner kopieren</button>
  <p class="copied-msg" id="copiedMsg" role="status" aria-live="polite"></p>
</div>
<script src="script.js"></script>
</body>
</html>

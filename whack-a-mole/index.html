<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Whack-a-Mole</h1>
  <p class="hint">Klicke die auftauchenden Maulwürfe an, bevor die Zeit abläuft.</p>

  <div class="stats">
    <div>
      <span class="label">Punkte</span>
      <span id="score" class="value">0</span>
    </div>
    <div>
      <span class="label">Zeit</span>
      <span id="time" class="value">30</span>
    </div>
    <div>
      <span class="label">Bestwert</span>
      <span id="best" class="value">0</span>
    </div>
  </div>

  <button id="startBtn">Spiel starten</button>
  <p id="gameOver" class="game-over" aria-live="polite"></p>

  <div id="grid" class="grid"></div>
</div>
<script src="script.js"></script>
</body>
</html>

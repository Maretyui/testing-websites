<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text-Case-Konverter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Text-Case-Konverter</h1>
  <p class="hint">Text eintippen — camelCase, PascalCase, snake_case, kebab-case, CONSTANT_CASE, Title Case und Sentence case werden live erzeugt.</p>

  <label class="field-label" for="textInput">Eingabetext</label>
  <textarea id="textInput" rows="2" placeholder="z.B. Hallo Welt Beispiel"></textarea>

  <div class="results" id="results"></div>
</div>
<script src="script.js"></script>
</body>
</html>

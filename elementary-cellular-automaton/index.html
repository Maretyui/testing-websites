<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elementarer Zellularautomat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Elementarer Zellularautomat</h1>
  <p class="hint">Wolframs 1D-Zellularautomaten (Regel 0–255) — jede Zeile ergibt sich aus den drei Zellen der Zeile darüber, rein clientseitig auf Canvas gezeichnet.</p>

  <div class="controls">
    <div class="field">
      <label for="ruleInput">Regel (0–255)</label>
      <input type="number" id="ruleInput" min="0" max="255" value="30">
    </div>
    <div class="field">
      <label for="startSelect">Startzeile</label>
      <select id="startSelect">
        <option value="single">Eine Zelle (Mitte)</option>
        <option value="random">Zufällig</option>
      </select>
    </div>
    <button id="randomRuleBtn" type="button">Zufällige Regel</button>
  </div>

  <div class="presets">
    <span>Bekannte Regeln:</span>
    <button type="button" class="preset-btn" data-rule="30">30</button>
    <button type="button" class="preset-btn" data-rule="90">90</button>
    <button type="button" class="preset-btn" data-rule="110">110</button>
    <button type="button" class="preset-btn" data-rule="184">184</button>
  </div>

  <canvas id="grid" width="600" height="360" aria-label="Zellularautomat-Visualisierung"></canvas>

  <div class="rule-preview" id="rulePreview" aria-hidden="true"></div>
</div>
<script src="script.js"></script>
</body>
</html>

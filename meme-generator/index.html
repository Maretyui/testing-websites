<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meme-Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Meme-Generator</h1>
  <p class="hint">Bild auswählen, Ober- und Untertext eintragen, fertiges Meme als PNG herunterladen.</p>

  <label class="file-btn" for="imageInput">Bild auswählen</label>
  <input type="file" id="imageInput" accept="image/*" hidden>

  <div class="canvas-wrap">
    <canvas id="canvas" width="480" height="480"></canvas>
    <p class="placeholder" id="placeholder">Noch kein Bild ausgewählt</p>
  </div>

  <div class="fields">
    <label class="field">
      Obertext
      <input type="text" id="topText" placeholder="z. B. WENN DER CODE">
    </label>
    <label class="field">
      Untertext
      <input type="text" id="bottomText" placeholder="z. B. BEIM ERSTEN VERSUCH LÄUFT">
    </label>
  </div>

  <button type="button" id="downloadBtn" class="download-btn" disabled>Als PNG herunterladen</button>
</div>
<script src="script.js"></script>
</body>
</html>

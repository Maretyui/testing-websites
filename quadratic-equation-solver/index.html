<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadratische-Gleichungen-Löser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Quadratische-Gleichungen-Löser</h1>
  <p class="hint">ax² + bx + c = 0 — Lösung live über die Mitternachtsformel, rein clientseitig.</p>

  <div class="equation-row">
    <div class="term">
      <input type="number" id="coefA" value="1" step="any">
      <span>x² +</span>
    </div>
    <div class="term">
      <input type="number" id="coefB" value="0" step="any">
      <span>x +</span>
    </div>
    <div class="term">
      <input type="number" id="coefC" value="0" step="any">
      <span>= 0</span>
    </div>
  </div>

  <div class="result" id="result"></div>
</div>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Snake</h1>
  <p class="hint">Pfeiltasten oder WASD zum Steuern, Leertaste pausiert. Rein clientseitig, nichts wird gespeichert oder gesendet.</p>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">Punkte</span>
      <span class="stat-value" id="score">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Highscore</span>
      <span class="stat-value" id="highscore">0</span>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <p id="overlayText">Bereit?</p>
      <button id="startBtn">Start</button>
    </div>
  </div>

  <div class="controls">
    <label>
      Geschwindigkeit
      <select id="speedSelect">
        <option value="140">Langsam</option>
        <option value="100" selected>Normal</option>
        <option value="65">Schnell</option>
      </select>
    </label>
    <button id="pauseBtn" disabled>Pause</button>
  </div>

  <div class="dpad" id="dpad" aria-hidden="true">
    <button data-dir="up" class="dpad-up">&#9650;</button>
    <button data-dir="left" class="dpad-left">&#9664;</button>
    <button data-dir="down" class="dpad-down">&#9660;</button>
    <button data-dir="right" class="dpad-right">&#9654;</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
